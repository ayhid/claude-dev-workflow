name: reconcile

# Merging a PR is not, on its own, enough to move a ticket. This repo is a
# consumer of its own workflow, so it feels that directly: #1, #2, #3 and #6 all
# ended up wrong, in two different ways.
#
#   - A PR whose only link to its issue is the commit convention
#     `type(scope): description (#12)` closes nothing. That is a *reference*, not
#     one of GitHub's closing keywords, so the issue stays open carrying whatever
#     `status:` label it had.
#   - A PR opened by `dev.mjs land --apply` carries `Closes #12`, so GitHub closes
#     the issue at merge — before anything can relabel it. The issue then reads as
#     done via its closed state and as in-review via its label, indefinitely. #6
#     sat like that from 2026-08-15 until it was fixed by hand.
#
# Both are `sync`'s job now, and there is one step below because of it. The
# second half used to be a shell step here that swapped the label directly —
# repo-local glue standing in for a gap in the tool, spelling the label names a
# second time in a place `.dev-workflow.json` could not reach. #30 closed the gap
# (`provider.checkRepresentation` / `repairRepresentation`), so every project
# installing this workflow gets the repair rather than only this one.
#
# One property the glue had and this does not: it scanned the last 100 closed
# issues regardless of age. `sync` reconciles what a PR or a landed commit since
# `--since` (30d) references, which covers the strand at the moment it is created
# — a merge is what creates it, and this runs on the merge. A strand older than
# the window needs one wider run by hand: `dev.mjs sync --apply --deep --since 1y`.

on:
  pull_request:
    types: [closed]
  # A merge that happened while this workflow was broken would otherwise stay
  # wrong until somebody noticed. sync is forward-only and idempotent, so a
  # weekly run that finds nothing costs one API call and no writes.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write # sync moves tickets and repairs stranded labels
  pull-requests: read # one half of sync's evidence is the PR list; the other is local

concurrency:
  group: reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    # `closed` fires on every close. Only a merge is evidence that work landed;
    # a PR closed unmerged must leave its ticket exactly where it is.
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      # Full history, because half of sync's evidence is now local: it reads the
      # commit subjects on the base branch, which is the only thing that sees
      # work landed without a PR. At the default depth of 1 that log is one
      # commit long and the scan silently finds nothing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          # The floor in package.json engines, matching the other jobs.
          node-version: '22'

      # No install step, deliberately: _dev-workflow/ is committed and has no
      # dependencies of its own. That is the same property the ci `install` job
      # exists to prove, exercised here for real on every merge.
      #
      # --deep is not optional. A branch named by hand carries no issue ID, so
      # for those PRs the commit subjects are the only link to the issue.
      - name: Reconcile the ladder against the PRs and commits that exist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node _dev-workflow/scripts/dev.mjs sync --apply --deep
