name: Adversarial review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: adversarial-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build payloads
        id: payloads
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          mkdir -p /tmp/review

          # Paths no reviewer reads. Kept in step with DEFAULT_DIFF_EXCLUDES in
          # lib/vcs.mjs — `.lock$` alone misses package-lock.json and
          # pnpm-lock.yaml, which are the two that actually blow the line ceiling.
          EXCLUDE='(\.lock$|(^|/)(package-lock|npm-shrinkwrap)\.json$|(^|/)pnpm-lock\.ya?ml$|(^|/)dist/|\.generated\.)'

          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" \
            | tr '\0' '\n' | grep -vE "$EXCLUDE" > /tmp/review/changed.txt || true

          if [ ! -s /tmp/review/changed.txt ]; then
            : > /tmp/review/change.diff
            : > /tmp/review/context.txt
            echo "lines=0" >> "$GITHUB_OUTPUT"
          else
            # The diff. Every layer gets this — and it is the FILTERED diff, or the
            # blind layer spends its whole context on a regenerated lockfile.
            tr '\n' '\0' < /tmp/review/changed.txt \
              | xargs -0 git diff "$BASE_SHA...$HEAD_SHA" -- > /tmp/review/change.diff

            LINES=$(tr '\n' '\0' < /tmp/review/changed.txt \
              | xargs -0 git diff --numstat "$BASE_SHA...$HEAD_SHA" -- \
              | awk '{ a += ($1 == "-" ? 0 : $1); d += ($2 == "-" ? 0 : $2) } END { print a + d + 0 }')
            echo "lines=$LINES" >> "$GITHUB_OUTPUT"

            # Full source of changed files. Edge case and audit layers only.
            : > /tmp/review/context.txt
            while IFS= read -r f; do
              if [ -f "$f" ]; then
                printf '=== %s ===\n' "$f" >> /tmp/review/context.txt
                cat "$f" >> /tmp/review/context.txt
                printf '\n' >> /tmp/review/context.txt
              fi
            done < /tmp/review/changed.txt
          fi

          # Intent. Audit layer only. Never reaches the blind layer.
          {
            printf 'Title: %s\n\n' "$PR_TITLE"
            printf '%s\n' "$PR_BODY"
          } > /tmp/review/intent.md

      - name: Skip oversized diffs
        if: steps.payloads.outputs.lines > 800
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" --body \
            "Adversarial review skipped: ${{ steps.payloads.outputs.lines }} changed lines. Review quality collapses past 800. Split the branch."
          exit 0

      - name: Run the three layers
        if: steps.payloads.outputs.lines <= 800
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-large-latest
          DIFF_PATH: /tmp/review/change.diff
          CONTEXT_PATH: /tmp/review/context.txt
          INTENT_PATH: /tmp/review/intent.md
          OUT_PATH: /tmp/review/report.md
        run: node .github/scripts/adversarial-review.mjs

      - name: Post the report
        if: steps.payloads.outputs.lines <= 800
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "${{ github.event.pull_request.number }}" \
            --body-file /tmp/review/report.md
