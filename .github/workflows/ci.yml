name: ci

# `main` is the distribution channel — `npx github:ayhid/claude-dev-workflow` installs
# straight from it — so a broken commit ships the moment it lands. Everything
# here is offline and secretless.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    # The Qlty action reads github.token by default; without a block here it
    # would inherit the repository default, which may be broader than a
    # checkout needs. Coverage authenticates with its own token, so id-token
    # (OIDC) is not required.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor declared in package.json engines.
          node-version: '22'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - run: npm run lint

      # The coverage variant, not test:unit — it runs the same suite and drops an
      # lcov.info for the upload below. Two runs would double the job for one file.
      - run: npm run test:coverage
      - run: npm run test:hook

      - name: Upload coverage to Qlty
        # Pinned to the commit v2 pointed at when added: a moved tag would run
        # unreviewed code with QLTY_COVERAGE_TOKEN in scope.
        uses: qltysh/qlty-action/coverage@08a0a862c159eae9b9003081da6663d96efef637 # v2
        with:
          token: ${{ secrets.QLTY_COVERAGE_TOKEN }}
          # Where test:coverage writes it — the repo root, not the coverage/
          # directory Qlty's setup page assumes.
          files: lcov.info
          # The action downloads the Qlty CLI at run time and hands it the
          # token, so pinning the action alone freezes nothing that touches the
          # secret. This is the release the first successful upload ran on.
          cli-version: '0.643.0'
          # A coverage upload is reporting, not a gate. Qlty being down, rate
          # limiting, or the token being absent must not fail a green build.
          # This is the action's default; spelled out so the intent survives a
          # default change upstream.
          skip-errors: true

  # A unit test can assert the installer's plan; only a real install proves the
  # copied tree actually runs. The payload has no dependencies, so this needs
  # no install step of its own — which is itself the thing being verified.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install into a scratch project
        run: |
          mkdir -p /tmp/scratch
          node -e "
            const { installPayload } = await import('./bin/lib/payload.mjs');
            const r = installPayload({
              sourceRoot: process.cwd(),
              projectDir: '/tmp/scratch',
              version: '0.0.0-ci',
            });
            console.log('written', r.written.length, 'hook', r.hookAdded);
            if (!r.hookAdded || r.written.length === 0) process.exit(1);
          " --input-type=module

      - name: The expected tree exists
        run: |
          set -e
          for f in \
            _dev-workflow/scripts/dev.mjs \
            _dev-workflow/lib/config.mjs \
            _dev-workflow/hooks/check-commit-ticket.sh \
            _dev-workflow/_config/manifest.json \
            .claude/settings.json \
            .claude/skills/dev-task/SKILL.md \
            .claude/skills/dev-bug/SKILL.md \
            .claude/skills/dev-done/SKILL.md \
            .claude/skills/dev-init/SKILL.md
          do
            test -f "/tmp/scratch/$f" && echo "ok   $f" || { echo "FAIL missing $f"; exit 1; }
          done
          test -x /tmp/scratch/_dev-workflow/hooks/check-commit-ticket.sh \
            || { echo "FAIL hook is not executable"; exit 1; }
          test ! -d /tmp/scratch/_dev-workflow/node_modules \
            || { echo "FAIL payload must have no node_modules"; exit 1; }

      - name: The installed runtime runs with no dependencies
        run: |
          cd /tmp/scratch
          echo '{"baseUrl":"https://example.invalid","project":"ABC"}' > .dev-workflow.json
          node _dev-workflow/scripts/dev.mjs config | tee out.txt
          grep -q "project:     ABC" out.txt

      - name: The installed hook still enforces
        run: |
          cd /tmp/scratch

          # Build the payload with jq, as tests/hook.test.sh does. A printf
          # format string cannot carry this safely: GNU printf eats the
          # backslash in \" and emits invalid JSON, on which the hook correctly
          # bails open — so the assertion passed on macOS and silently tested
          # nothing on Linux.
          check() {
            local desc="$1" cmd="$2" want="$3" got
            set +e
            jq -n --arg c "$cmd" '{tool_name:"Bash", tool_input:{command:$c}}' \
              | CLAUDE_PROJECT_DIR="$PWD" bash _dev-workflow/hooks/check-commit-ticket.sh >/dev/null 2>&1
            got=$?
            set -e
            if [ "$got" -eq "$want" ]; then
              echo "ok   $desc"
            else
              echo "FAIL $desc: want exit $want, got $got"
              return 1
            fi
          }

          rc=0
          check "a ticketless commit is blocked" 'git commit -m "no ticket"'            2 || rc=1
          check "the escape hatch is allowed"    'git commit -m "chore(no-ticket): x"'  0 || rc=1
          check "the hatch carries any type"     'git commit -m "feat(no-ticket): x"'   0 || rc=1
          check "a referencing commit is allowed" 'git commit -m "fix: x (ABC-1)"'      0 || rc=1
          check "a non-commit command is allowed" 'ls -la'                              0 || rc=1
          exit "$rc"

      - name: Re-running is idempotent
        run: |
          node -e "
            const { installPayload, readManifest } = await import('./bin/lib/payload.mjs');
            const before = readManifest('/tmp/scratch');
            const r = installPayload({
              sourceRoot: process.cwd(),
              projectDir: '/tmp/scratch',
              version: '0.0.0-ci',
            });
            if (r.hookAdded) { console.error('FAIL duplicate hook entry'); process.exit(1); }
            if (r.skipped.length) { console.error('FAIL unexpected skips', r.skipped); process.exit(1); }
            const after = readManifest('/tmp/scratch');
            if (after.installation.installDate !== before.installation.installDate) {
              console.error('FAIL install date was not preserved'); process.exit(1);
            }
            console.log('ok   idempotent');
          " --input-type=module

      - name: Skill frontmatter is well-formed
        run: |
          rc=0
          for f in skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            name=$(grep -m1 '^name:' "$f" | sed 's/^name:[[:space:]]*//')
            grep -q '^description:' "$f" || { echo "FAIL $f: no description:"; rc=1; }
            [ "$name" = "$dir" ] || { echo "FAIL $f: name '$name' != directory '$dir'"; rc=1; }
            # 1.1.0 shipped `task`, `bug` and `done` past the check above: they
            # matched their directories, and both were too generic to claim in a
            # namespace shared with every other skill the user has installed.
            case "$dir"  in dev-*) ;; *) echo "FAIL $f: directory '$dir' is not namespaced dev-"; rc=1 ;; esac
            case "$name" in dev-*) ;; *) echo "FAIL $f: name '$name' is not namespaced dev-"; rc=1 ;; esac
            [ "$rc" -eq 0 ] && echo "ok   $f"
          done
          exit "$rc"

  # Releases are automatic, so this gate is the only thing between a push and a
  # published version: `needs` means nothing ships over a red tree. What it
  # cannot prove is a write path against a live tracker — CI has no instance and
  # no token — which is why the pre-push checklist in the repo-local /release
  # skill is still run by hand. The version bump lands back on `main` because
  # that is the distribution channel for the `github:` install path.
  release:
    needs: [test, install]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write         # push the version bump and the tag
      issues: write           # release comments on resolved issues
      pull-requests: write
      id-token: write         # npm provenance
    steps:
      - uses: actions/checkout@v4
        with:
          # semantic-release derives the next version from the commits since the
          # last tag; a shallow clone has neither.
          fetch-depth: 0
          persist-credentials: false

      # 24, not the 22 the other jobs pin. `engines` says >=22 and that floor is
      # what `test` and `install` exist to prove, but publishing is a different
      # question: npm trusted publishing needs npm >= 11.5.1, and the 22 line is
      # pinned at npm 10.9.8 for good — npm majors are not backported into an
      # LTS. 24 bundles npm 11, so the toolchain satisfies it by construction
      # rather than by a mutable `npm install -g npm@latest` on every run.
      #
      # setup-node does not manage npm independently: it installs whatever npm
      # the chosen Node bundles, so bumping the action version alone changes
      # nothing here. The Node version is the only lever.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci --no-audit --no-fund

      # NPM_TOKEN is the bootstrap, not the destination. npm's trusted publishing
      # (OIDC) needs no secret at all, but it is configured on a package's
      # settings page — which cannot exist until the package has been published
      # once. So: publish once with a granular token, then add the trusted
      # publisher on npmjs.com and delete both this env entry and the secret.
      # `id-token: write` above is already what OIDC needs.
      # No npm credential here on purpose: publishing is authenticated by npm's
      # trusted publishing (OIDC), configured against this repo and this
      # workflow file on npmjs.com. `id-token: write` above is the whole of what
      # it needs from us.
      #
      # @semantic-release/npm exchanges a GitHub Actions ID token for a
      # short-lived registry token, and on success returns *before* writing any
      # .npmrc — so setup-node's `_authToken=${NODE_AUTH_TOKEN}` placeholder is
      # never consulted, and `npm publish` authenticates itself. That last part
      # is why the release job pins Node 24: the CLI does the OIDC exchange, and
      # it only learned how in npm 11.5.1.
      #
      # A failure here reads as ENONPMTOKEN — that is the OIDC exchange having
      # failed and the plugin falling back to looking for a token, not a missing
      # secret. Check the trusted publisher's workflow filename first.
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release

      # The Homebrew formula follows the release from inside this job, not on
      # the `release` event: a release created with the workflow token fires no
      # other workflow. semantic-release has already pushed the version bump to
      # package.json, so the formula is behind exactly when the two disagree —
      # and a run that published nothing leaves both alone.
      #
      # The checksum is taken from the tarball the registry serves, never from a
      # local `npm pack`, so the formula can only describe what `brew` downloads.
      - name: Point the Homebrew formula at the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git fetch --quiet origin main
          git checkout --quiet main
          released="$(node -p 'require("./package.json").version')"
          formula="$(node --input-type=module -e 'import { readFileSync } from "node:fs"; import { formulaVersion } from "./tools/bump-formula.mjs"; console.log(formulaVersion(readFileSync("Formula/claude-dev-workflow.rb", "utf8")) ?? "")')"
          if [ "$released" = "$formula" ]; then
            echo "formula already at $released"
            exit 0
          fi
          node tools/bump-formula.mjs "$released"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/claude-dev-workflow.rb
          git commit --quiet -m "chore(release): brew formula $released [skip ci]"
          git push --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
