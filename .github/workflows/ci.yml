name: ci

# `main` is the distribution channel — `npx github:ayhid/claude-youtrack-workflow` installs
# straight from it — so a broken commit ships the moment it lands. Everything
# here is offline and secretless.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # The floor declared in package.json engines.
          node-version: '22'

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - run: npm run lint
      - run: npm run test:unit
      - run: npm run test:hook

  # A unit test can assert the installer's plan; only a real install proves the
  # copied tree actually runs. The payload has no dependencies, so this needs
  # no install step of its own — which is itself the thing being verified.
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install into a scratch project
        run: |
          mkdir -p /tmp/scratch
          node -e "
            const { installPayload } = await import('./bin/lib/payload.mjs');
            const r = installPayload({
              sourceRoot: process.cwd(),
              projectDir: '/tmp/scratch',
              version: '0.0.0-ci',
            });
            console.log('written', r.written.length, 'hook', r.hookAdded);
            if (!r.hookAdded || r.written.length === 0) process.exit(1);
          " --input-type=module

      - name: The expected tree exists
        run: |
          set -e
          for f in \
            _youtrack/scripts/yt.mjs \
            _youtrack/lib/config.mjs \
            _youtrack/hooks/check-commit-ticket.sh \
            _youtrack/_config/manifest.json \
            .claude/settings.json \
            .claude/skills/yt-task/SKILL.md \
            .claude/skills/yt-bug/SKILL.md \
            .claude/skills/yt-done/SKILL.md \
            .claude/skills/yt-init/SKILL.md
          do
            test -f "/tmp/scratch/$f" && echo "ok   $f" || { echo "FAIL missing $f"; exit 1; }
          done
          test -x /tmp/scratch/_youtrack/hooks/check-commit-ticket.sh \
            || { echo "FAIL hook is not executable"; exit 1; }
          test ! -d /tmp/scratch/_youtrack/node_modules \
            || { echo "FAIL payload must have no node_modules"; exit 1; }

      - name: The installed runtime runs with no dependencies
        run: |
          cd /tmp/scratch
          echo '{"baseUrl":"https://example.invalid","project":"ABC"}' > .youtrack.json
          node _youtrack/scripts/yt.mjs config | tee out.txt
          grep -q "project:     ABC" out.txt

      - name: The installed hook still enforces
        run: |
          cd /tmp/scratch
          printf '{"tool_input":{"command":"git commit -m \"no ticket\""}}' \
            | CLAUDE_PROJECT_DIR="$PWD" bash _youtrack/hooks/check-commit-ticket.sh \
            && { echo "FAIL bad commit was allowed"; exit 1; } \
            || echo "ok   bad commit blocked"

      - name: Re-running is idempotent
        run: |
          node -e "
            const { installPayload, readManifest } = await import('./bin/lib/payload.mjs');
            const before = readManifest('/tmp/scratch');
            const r = installPayload({
              sourceRoot: process.cwd(),
              projectDir: '/tmp/scratch',
              version: '0.0.0-ci',
            });
            if (r.hookAdded) { console.error('FAIL duplicate hook entry'); process.exit(1); }
            if (r.skipped.length) { console.error('FAIL unexpected skips', r.skipped); process.exit(1); }
            const after = readManifest('/tmp/scratch');
            if (after.installation.installDate !== before.installation.installDate) {
              console.error('FAIL install date was not preserved'); process.exit(1);
            }
            console.log('ok   idempotent');
          " --input-type=module

      - name: Skill frontmatter is well-formed
        run: |
          rc=0
          for f in skills/*/SKILL.md; do
            dir=$(basename "$(dirname "$f")")
            name=$(grep -m1 '^name:' "$f" | sed 's/^name:[[:space:]]*//')
            grep -q '^description:' "$f" || { echo "FAIL $f: no description:"; rc=1; }
            [ "$name" = "$dir" ] || { echo "FAIL $f: name '$name' != directory '$dir'"; rc=1; }
            [ "$rc" -eq 0 ] && echo "ok   $f"
          done
          exit "$rc"
